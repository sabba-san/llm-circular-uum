services:
  llm-uum:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm_uum_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./circular_forms:/app/circular_forms
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

