services:
  llm-uum:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm_uum_app
    restart: "no"
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./circular_forms:/app/circular_forms
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  n8n:
    image: n8nio/n8n:latest
    container_name: llm_uum_n8n
    restart: "no"
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kuala_Lumpur
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/home/node/workflows:ro
    depends_on:
      llm-uum:
        condition: service_healthy

volumes:
  n8n_data:

